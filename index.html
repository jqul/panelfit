<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Tema oscuro desde el primer pintado: la preferencia se guardaba pero solo se aplicaba
      // al montar el interruptor (en la vista del cliente, al entrar en "Más"), así que la app
      // arrancaba clara aunque estuviera elegida la oscura, y con parpadeo en el panel.
      try { if (localStorage.getItem("pf_dark_mode") === "1") document.documentElement.classList.add("dark") } catch (e) {}
    </script>
    <script>
      // Si un archivo con hash de /assets falla al cargar (despliegue nuevo con la
      // pestaña abierta, o index.html en caché apuntando a archivos ya borrados) la
      // app ni arranca: se recarga una vez para traer la versión nueva. Mismo freno
      // y misma clave que src/lib/staleChunk.ts, para no entrar en bucle.
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return
        if ((t.src || t.href || '').indexOf('/assets/') === -1) return
        try {
          var last = Number(sessionStorage.getItem('pf_stale_reload_at') || 0)
          if (last && Date.now() - last < 30000) return
          sessionStorage.setItem('pf_stale_reload_at', String(Date.now()))
        } catch (_) { return }
        location.reload()
      }, true)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="CLbDaJEI5u5Ws8E6PHR5lFqd5pWGGitT3BJQyBXXI4Y" />

    <!-- PWA -->
    <!-- Manifiesto: con el enlace de un cliente (/?c=<token>) se pide el que sirve el servidor, cuyo start_url lleva ese
         enlace. Tiene que estar puesto ANTES de que el navegador lo lea (iOS lo lee al cargar la página, no después), por
         eso se decide aquí y no desde la aplicación. Sin enlace válido, el general de siempre. La misma regla de forma de
         token que lib/clientLink.ts y api/manifest.js. -->
    <script>
      (function () {
        var href = '/manifest.json'
        try {
          var c = new URLSearchParams(location.search).get('c')
          if (c && /^[A-Za-z0-9_-]{8,128}$/.test(c)) href = '/api/manifest?c=' + c
        } catch (e) { /* se queda el general */ }
        var link = document.createElement('link')
        link.rel = 'manifest'
        link.href = href
        document.head.appendChild(link)
      })()
    </script>

    <!-- Registrar Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PanelFit] SW registrado:', reg.scope))
