<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf9f7"/>
      <stop offset="100%" stop-color="#f3ede6"/>
    </linearGradient>
    <linearGradient id="accent-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#b07d4a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b07d4a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle accent circle -->
  <ellipse cx="900" cy="200" rx="400" ry="400" fill="#b07d4a" fill-opacity="0.06"/>
  <ellipse cx="200" cy="500" rx="300" ry="300" fill="#b07d4a" fill-opacity="0.04"/>

  <!-- Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#e8ddd3" stroke-width="1.5"/>

  <!-- Logo -->
  <text x="80" y="120" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#1a1a1a">Panel</text>
  <text x="232" y="120" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#b07d4a" font-style="italic">Fit</text>

  <!-- Divider -->
  <line x1="80" y1="142" x2="320" y2="142" stroke="#e8ddd3" stroke-width="1.5"/>

  <!-- Headline -->
  <text x="80" y="230" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#1a1a1a">Un panel único</text>
  <text x="80" y="315" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#b07d4a" font-style="italic">por cliente</text>

  <!-- Subtext -->
  <text x="80" y="390" font-family="-apple-system, system-ui, sans-serif" font-size="28" fill="#7a6a5a">Software para entrenadores personales</text>
  <text x="80" y="428" font-family="-apple-system, system-ui, sans-serif" font-size="28" fill="#7a6a5a">Sin apps · Sin PDFs · Sin complicaciones</text>

  <!-- Stats pills -->
  <rect x="80" y="480" width="200" height="64" rx="16" fill="white" stroke="#e8ddd3" stroke-width="1.5"/>
  <text x="180" y="508" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">Sin app</text>
  <text x="180" y="532" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#7a6a5a" text-anchor="middle">para el cliente</text>

  <rect x="300" y="480" width="200" height="64" rx="16" fill="white" stroke="#e8ddd3" stroke-width="1.5"/>
  <text x="400" y="508" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">2 min</text>
  <text x="400" y="532" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#7a6a5a" text-anchor="middle">alta de cliente</text>

  <rect x="520" y="480" width="200" height="64" rx="16" fill="white" stroke="#e8ddd3" stroke-width="1.5"/>
  <text x="620" y="508" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">1 enlace</text>
  <text x="620" y="532" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#7a6a5a" text-anchor="middle">por WhatsApp</text>

  <!-- URL -->
  <text x="1120" y="564" font-family="-apple-system, system-ui, sans-serif" font-size="22" fill="#b07d4a" text-anchor="end">panelfit.vercel.app</text>
</svg>
